apiVersion: v1
kind: Service
metadata:
  namespace: fleet-apps
  name: nginx-service
spec:
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
  #type: NodePort
---
# my-fleet-apps/nginx-app/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: fleet-apps
  name: nginx-deployment
spec:
  replicas: 2  # 我們希望有 2 個 Nginx Pod
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.25.3 # 使用特定版本的 Nginx
        ports:
        - containerPort: 80